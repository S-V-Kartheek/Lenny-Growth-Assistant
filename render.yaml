# Render Blueprint for the Lenny Growth Assistant backend.
#
# Deploys:
#   lenny-api  FastAPI backend (Docker), running the ingestion pipeline as a
#              pre-deploy step so the corpus is indexed before traffic is served.
#
# Database: Supabase Postgres (pgvector enabled), not a service this
# Blueprint provisions -- DATABASE_URL below is a manually-set secret
# pointing at the Supabase project's session pooler connection string. Set
# up once via the Supabase dashboard/MCP; not part of `render.yaml` because
# a Supabase project isn't a Render resource type.
#
# The frontend is NOT deployed here -- it goes to Vercel separately, and its
# VITE_API_BASE_URL build-time env var must point at lenny-api's public URL.
#
# Ollama cannot run on Render (no GPU / no persistent local model cache), so
# this deployment uses cloud providers instead (see LLM_PROVIDER /
# LLM_FALLBACK_PROVIDER below) -- the app's LLMProvider abstraction (see
# backend/app) picks up a provider change with no code change.
#
# Deploy: connect this repo in the Render dashboard ("New +" -> "Blueprint"),
# or `render blueprints launch` with the Render CLI.

services:
  - type: web
    name: lenny-api
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    # Runs the one-shot ingestion pipeline before each deploy starts serving
    # traffic -- the Docker equivalent of compose's `ingest` service gating `api`.
    preDeployCommand: python -m app.ingestion.pipeline
    envVars:
      # Matches the Dockerfile's EXPOSE 8000 / uvicorn --port 8000.
      - key: PORT
        value: "8000"
      # Supabase Postgres (checkpoint 6), not Render's managed Postgres --
      # set manually in the Render dashboard to the project's "Session
      # pooler" connection string (Supabase dashboard -> Project Settings ->
      # Database -> Connection string -> Session pooler, port 5432). The
      # session pooler is required, not the direct connection: Supabase's
      # direct host is IPv6-only and Render's outbound network is IPv4, and
      # unlike the transaction pooler, the session pooler supports prepared
      # statements the same as a direct connection, so no asyncpg
      # connect_args change is needed. sync: false so the password is never
      # committed.
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      # Fill in with the deployed Vercel URL(s) once the frontend is live,
      # e.g. https://lenny-growth-assistant.vercel.app -- comma-separated,
      # never "*" (the API carries session identity in cookies/headers).
      - key: CORS_ORIGINS
        value: https://lennisassistant.vercel.app

      # --- Cloud LLM provider (Ollama is local-only, see header note) ---
      # The header's toggle only offers ollama/gemini (see frontend
      # Header.tsx) -- ollama will correctly show provider_unavailable here
      # since there's no host for it to reach on Render, which is expected:
      # the toggle is a local-vs-cloud demo of the same LLMProvider
      # abstraction, not a promise every option works on every deployment.
      - key: LLM_PROVIDER
        value: gemini
      # Grok as the standby: if Gemini times out or is unreachable
      # (ProviderTimeout/ProviderUnavailable, see app/llm/registry.py), the
      # gateway retries on Grok before the first token is emitted, rather than
      # the request degrading straight to the static refusal. Requires
      # GROK_API_KEY to actually be set below -- with no key this is a no-op
      # and the system fails loudly same as before.
      - key: LLM_FALLBACK_PROVIDER
        value: grok
      - key: LLM_TEMPERATURE
        value: "0.3"
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "2048"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROK_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-4-fast
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

      # --- Embeddings: no local Ollama on Render, so semantic search uses
      # Gemini's hosted embedding model instead. gemini-embedding-001 with
      # outputDimensionality=768 (set in app/retrieval/embeddings.py) matches
      # the vector(768) column, so this needs no schema change -- and it
      # reuses the same GEMINI_API_KEY as the LLM above, so no extra secret
      # to configure. text-embedding-004 (the model used here originally) was
      # deprecated and returns a 404 as of this checkpoint -- confirmed via
      # the API's own /v1beta/models listing, which no longer includes it. ---
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001

      - key: RETRIEVAL_TOP_K
        value: "6"
      - key: RETRIEVAL_CANDIDATE_K
        value: "30"
      - key: RETRIEVAL_MIN_CONFIDENCE
        value: "0.48"
      - key: RETRIEVAL_MAX_PER_EPISODE
        value: "2"

      - key: CORPUS_REPO
        value: ChatPRD/lennys-podcast-transcripts
      - key: CORPUS_COMMIT
        value: be8ab89a890a833cbba2c892178f823fff178c65
      - key: INGEST_MIN_DURATION_SECONDS
        value: "1200"
      - key: INGEST_MAX_EPISODES
        value: "40"
      - key: INGEST_ALL
        value: "false"

      - key: MAX_MESSAGE_CHARS
        value: "4000"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
